<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags (defaults — overridden per page by react-helmet-async) -->
  <title>Marsana - Premium Online Marketplace</title>
  <meta name="description"
    content="Marsana is your premium online marketplace. Discover quality products from trusted sellers at competitive prices." />
  <meta name="keywords" content="e-commerce, online shopping, marsana, products, store, marketplace" />
  <meta name="author" content="Marsana" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Marsana - Premium Online Marketplace" />
  <meta property="og:description" content="Discover quality products from trusted sellers at competitive prices." />
  <meta property="og:site_name" content="Marsana" />
  <meta property="og:image" content="https://marsana.onrender.com/og-default.png" />
  <meta property="og:url" content="https://marsana.onrender.com" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Marsana - Premium Online Marketplace" />
  <meta name="twitter:description" content="Discover quality products from trusted sellers at competitive prices." />
  <meta name="twitter:image" content="https://marsana.onrender.com/og-default.png" />

  <!-- Canonical (overridden per page by react-helmet-async) -->
  <link rel="canonical" href="https://marsana.onrender.com" />

  <!-- Performance: Preconnect to external domains -->
  <link rel="preconnect" href="https://placehold.co" />
  <link rel="dns-prefetch" href="https://placehold.co" />

  <!-- Performance: Preload critical resources -->
  <link rel="preload" href="/src/main.jsx" as="script" />

  <!-- Security: CSP meta tag (basic) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#6366f1" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
