<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>Marsana - Premium E-Commerce Platform</title>
  <meta name="description"
    content="Marsana - Your premium destination for quality products. Shop with confidence with secure checkout, fast shipping, and excellent customer service." />
  <meta name="keywords" content="e-commerce, online shopping, marsana, products, store, marketplace" />
  <meta name="author" content="Marsana" />

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="xxxxxxxxxxxxxxxxxxxx" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Marsana - Premium E-Commerce Platform" />
  <meta property="og:description" content="Your premium destination for quality products. Shop with confidence." />
  <meta property="og:site_name" content="Marsana" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Marsana - Premium E-Commerce Platform" />
  <meta name="twitter:description" content="Your premium destination for quality products. Shop with confidence." />

  <!-- Performance: Preconnect to external domains -->
  <link rel="preconnect" href="https://placehold.co" />
  <link rel="dns-prefetch" href="https://placehold.co" />

  <!-- Performance: Preload critical resources -->
  <link rel="preload" href="/src/main.jsx" as="script" />

  <!-- Security: CSP meta tag (basic) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#6366f1" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
